<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Portfolio de Paz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Alfa+Slab+One&family=Bagel+Fat+One&family=Bungee&family=Climate+Crisis&family=Figtree:wght@400;500;700;800&family=Monoton&family=Rubik+Mono+One&family=Shrikhand&family=Ultra&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: mesa de trabajo — cuadrícula crema a sangre, letras grandes sobre bloques planos, objetos de escritorio que tiemblan en su lugar. Un solo look claro, deliberado. */
:root{
  --crema:#F3E8CC; --verde:#19532B; --amarillo:#FFCA26; --naranja:#F86015; --rojo:#D42518; --kiwi:#9ABC04;
  --grid:rgba(25,83,43,.13); --grid-strong:rgba(25,83,43,.24);
  --f-display:"Shrikhand","Abril Fatface",Georgia,serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
  --f-block:"Bungee","Alfa Slab One",Impact,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--crema);color:var(--verde);font-family:var(--f-body);font-size:1rem;line-height:1.55;overflow-x:hidden}
.cuadricula{
  background-color:var(--crema);
  background-image:
    linear-gradient(var(--grid-strong) 1.5px,transparent 1.5px),
    linear-gradient(90deg,var(--grid-strong) 1.5px,transparent 1.5px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  background-position:-1px -1px;
}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:3px solid var(--naranja);outline-offset:3px}

/* ---------- Etiquetas / botones ---------- */
.tag{display:inline-flex;align-items:center;gap:.5em;font-family:var(--f-block);font-size:clamp(.95rem,1.6vw,1.2rem);letter-spacing:.02em;text-decoration:none;
  padding:.7em 1.15em;border:3px solid var(--verde);background:var(--amarillo);color:var(--verde);cursor:pointer;line-height:1.1;
  transition:transform .15s ease,background .15s ease}
.tag:hover{transform:translate(-2px,-2px) rotate(-1deg);background:var(--naranja);color:var(--crema)}
.tag.verde{background:var(--verde);color:var(--amarillo)}
.tag.verde:hover{background:var(--rojo);color:var(--amarillo)}
.tag.crema{background:var(--crema)}
.tag.sm{font-size:.9rem;padding:.55em .9em;border-width:2.5px}

/* ---------- Portada ---------- */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;padding-block:clamp(10px,2vh,24px)}
.fila{display:flex;align-items:center;justify-content:space-between;gap:clamp(8px,2vw,32px);position:relative;z-index:1}
.fila.arriba{height:clamp(84px,17vh,180px)}
.fila.abajo{height:clamp(118px,24vh,250px);align-items:flex-end}
.obj{display:block;height:100%;width:100%;filter:drop-shadow(3px 5px 4px rgba(25,40,20,.28));transform-origin:50% 50%}
.obj svg{height:100%;width:100%;display:block;overflow:visible}
.slot{height:100%;display:flex;align-items:center;justify-content:center;min-width:0}
.fila.arriba .s-auri{flex:0 1 30%;justify-content:flex-start}
.fila.arriba .s-peg{flex:0 1 22%;height:100%}
.fila.arriba .s-cinta{flex:0 1 20%;justify-content:flex-end;height:90%}
.fila.abajo .s-tabla{flex:0 1 30%;justify-content:flex-start;align-items:flex-end}
.fila.abajo .s-tijera{flex:0 1 38%;height:96%}
.fila.abajo .s-cutter{flex:0 1 26%;justify-content:flex-end;height:66%;align-self:center}

.centro{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(14px,3vh,34px);padding-block:clamp(8px,2vh,20px)}
.hola{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,8.5vw,7.4rem);line-height:.95;margin:0;color:var(--verde);text-wrap:balance}
.hola .paz{color:var(--rojo)}
.collage{display:flex;flex-wrap:nowrap;justify-content:center;gap:clamp(2px,.5vw,8px);margin:0;max-width:100%}
.collage span{display:inline-flex;align-items:center;justify-content:center;font-size:clamp(2.1rem,9.2vw,8.6rem);line-height:1;padding:.08em .1em .02em;min-width:.85em}
.botones{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.botones .tag:nth-child(1){transform:rotate(-2deg)}
.botones .tag:nth-child(2){transform:rotate(1.5deg)}
.botones .tag:nth-child(1):hover{transform:rotate(-3deg) translate(-2px,-2px)}
.botones .tag:nth-child(2):hover{transform:rotate(2.5deg) translate(-2px,-2px)}

@keyframes agite{
  0%,58%,100%{transform:rotate(0)}
  62%{transform:rotate(-3deg)} 66%{transform:rotate(2.6deg)} 70%{transform:rotate(-2deg)} 74%{transform:rotate(1.4deg)} 78%{transform:rotate(-.6deg)} 82%{transform:rotate(0)}
}
.obj{animation:agite 4.2s ease-in-out infinite}
.s-auri .obj{animation-delay:.2s;animation-duration:4.6s}
.s-peg .obj{animation-delay:1.3s;animation-duration:3.9s}
.s-cinta .obj{animation-delay:2.2s;animation-duration:4.4s}
.s-tabla .obj{animation-delay:.8s;animation-duration:5.4s}
.s-tijera .obj{animation-delay:1.8s;animation-duration:4.1s}
.s-cutter .obj{animation-delay:2.9s;animation-duration:4.8s}
@media (prefers-reduced-motion:reduce){.obj{animation:none!important} html{scroll-behavior:auto} .tag{transition:none}}

.bajar{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7;z-index:3;display:none}

/* ---------- Categorías ---------- */
.seccion{padding-block:clamp(48px,9vh,110px)}
.wrap{max-width:1240px;margin:0 auto}
.rotulo{display:inline-block;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;background:var(--verde);color:var(--crema);padding:.35em .7em;transform:rotate(-1.5deg)}
.h-grande{font-family:var(--f-block);font-weight:400;font-size:clamp(2.2rem,6.5vw,5rem);line-height:1;margin:.3em 0 .6em;text-wrap:balance}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,26px)}
.card{display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:340px;aspect-ratio:3/4;max-width:100%;padding:22px 20px;border:3px solid var(--verde);text-decoration:none;color:var(--verde);position:relative;transition:transform .18s ease}
.card:hover{transform:rotate(-1.5deg) translateY(-4px)}
.card:nth-child(1){background:var(--amarillo)}
.card:nth-child(2){background:var(--naranja);color:var(--crema)}
.card:nth-child(3){background:var(--kiwi)}
.card .num{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.12em}
.card h3{font-family:var(--f-block);font-weight:400;font-size:clamp(1.7rem,2.6vw,2.3rem);line-height:1;margin:0;text-wrap:balance}
.card ul{list-style:none;margin:0;padding:0;font-weight:600;font-size:1rem;display:grid;gap:4px}
.card .ir{font-family:var(--f-block);font-size:.95rem;display:inline-flex;align-items:center;gap:.4em;border-top:2.5px solid currentColor;padding-top:12px}
@media (max-width:900px){.cards{grid-template-columns:1fr} .card{aspect-ratio:auto;min-height:260px}}
@media (max-width:560px){.cards{grid-template-columns:1fr} .card{min-height:250px}}

/* ---------- Páginas internas ---------- */
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:18px}
.topbar .izq{display:flex;flex-wrap:wrap;gap:10px}
.pagina{min-height:100vh;min-height:100svh;padding-bottom:80px}
.cabecera{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 22px;margin:18px 0 34px}
.bloque-titulo{font-family:var(--f-block);font-weight:400;font-size:clamp(2.3rem,8vw,6rem);line-height:.95;margin:0;padding:.12em .28em .06em;border:3px solid var(--verde);display:inline-block;transform:rotate(-1.2deg);max-width:100%;overflow-wrap:anywhere}
.materias{display:grid;gap:14px;max-width:1240px}
.materia{border:3px solid var(--verde);background:var(--crema);scroll-margin-top:24px}
.materia > h2{margin:0}
.mat-btn{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;cursor:pointer;font-family:var(--f-block);font-size:clamp(1.15rem,2.4vw,1.6rem);line-height:1.1;color:var(--verde)}
.mat-btn:focus-visible{outline:3px solid var(--naranja);outline-offset:-6px}
.mat-btn .mas{flex:none;width:38px;height:38px;border:2.5px solid var(--verde);display:grid;place-items:center;font-family:var(--f-body);font-weight:800;font-size:1.4rem;background:var(--amarillo);transition:transform .2s ease}
.mat-btn[aria-expanded="true"]{background:var(--verde);color:var(--crema)}
.mat-btn[aria-expanded="true"] .mas{transform:rotate(45deg)}
.mat-cuerpo{padding:6px 20px 22px;border-top:3px solid var(--verde)}
.datos{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 18px;font-size:.92rem}
.datos span{border:2px solid var(--verde);padding:.3em .6em;background:var(--crema)}
.datos b{font-family:var(--f-mono);font-weight:500;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;margin-right:.4em}
.trabajos{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.trabajos li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:12px 0;border-bottom:2px dashed var(--grid-strong)}
.trabajos li:last-child{border-bottom:0}
.trabajos .t{font-weight:700;font-size:1.08rem;min-width:0}
.vacio{margin:14px 0 0;font-style:italic;opacity:.8}

.obra-titulo{font-family:var(--f-block);font-weight:400;font-size:clamp(2rem,6vw,4.4rem);line-height:1;margin:6px 0 14px;text-wrap:balance}
.materia-chip{display:inline-block;font-family:var(--f-mono);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;background:var(--kiwi);color:var(--verde);border:2px solid var(--verde);padding:.3em .6em}
.desc{font-size:clamp(1.05rem,1.8vw,1.25rem);max-width:62ch;margin:0 0 26px}
.pendiente{border:3px dashed var(--verde);background:repeating-linear-gradient(-45deg,rgba(255,202,38,.18) 0 14px,transparent 14px 28px),var(--crema);padding:24px;max-width:880px}
.pendiente h3{font-family:var(--f-block);font-weight:400;margin:0 0 8px;font-size:1.2rem}
.pendiente p{margin:6px 0}
.pendiente code{font-family:var(--f-mono);background:var(--amarillo);padding:.1em .4em;border:1.5px solid var(--verde);font-size:.88em;overflow-wrap:anywhere}
.pendiente ul{margin:8px 0 0;padding-left:1.1em}

/* ---------- Sobre mí ---------- */
.sobre{background:var(--verde);color:var(--crema);padding-block:clamp(56px,10vh,120px);scroll-margin-top:0}
.sobre .tag{border-color:var(--crema)}
.sobre .tag:hover{background:var(--crema);color:var(--verde)}
.sobre-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,70px);align-items:center;max-width:1180px;margin:20px auto 0}
.foto{margin:0;justify-self:center;width:100%;max-width:440px;position:relative}
.fotos{display:grid;align-items:start;justify-items:center;transform:rotate(-2deg)}
.fotos img{grid-area:1/1;display:block;width:100%;height:auto;max-width:100%;border:4px solid var(--crema);opacity:0;transition:opacity 1s ease}
.fotos img.on{opacity:1}
.puntos{display:flex;gap:10px;justify-content:center;margin-top:20px}
.puntos button{width:16px;height:16px;padding:0;border:2.5px solid var(--crema);background:transparent;cursor:pointer}
.puntos button[aria-current="true"]{background:var(--amarillo);border-color:var(--amarillo)}
@media (prefers-reduced-motion:reduce){.fotos img{transition:none}}
.foto::after{content:"";position:absolute;width:110px;height:30px;background:rgba(230,211,163,.85);top:-12px;left:50%;transform:translateX(-50%) rotate(3deg)}
.sobre .sobre-h{font-family:var(--f-display);font-weight:400;font-size:clamp(2.8rem,7vw,5.6rem);line-height:.95;margin:0 0 .4em;color:var(--amarillo)}
.sobre p{font-size:clamp(1.05rem,1.55vw,1.2rem);line-height:1.7;max-width:62ch;margin:0 0 1.1em}
.mmo{color:var(--amarillo);font-weight:800}
@media (max-width:820px){.sobre-grid{grid-template-columns:1fr}.foto{max-width:360px}}

@media (max-width:640px){
  .fila.arriba{height:clamp(70px,13vh,110px)}
  .fila.abajo{height:clamp(100px,19vh,150px)}
  .fila.arriba .s-peg{height:90%}
}

/* ---------- Zócalo de cierre ---------- */
.zocalo{background:var(--rojo);color:var(--crema);padding-block:clamp(56px,10vh,110px);border-top:6px solid var(--amarillo)}
.zocalo .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(28px,5vw,80px);align-items:center;max-width:1180px}
.zocalo h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2.8rem,7.5vw,6.2rem);line-height:.95;margin:0;color:var(--crema);text-wrap:balance}
.zocalo h2 span{color:var(--amarillo)}
.zocalo .pista{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin:18px 0 0;color:var(--amarillo)}
.chat{display:flex;flex-direction:column;gap:14px;background:var(--crema);border:3px solid var(--verde);padding:22px 18px 18px;min-width:0}
.chat-top{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:2px solid rgba(25,83,43,.18);color:var(--verde);font-weight:800}
.chat-top i{width:34px;height:34px;display:grid;place-items:center;background:var(--rojo);color:var(--amarillo);font-style:normal;font-family:var(--f-display);font-size:1.1rem}
.chat-top small{display:block;font-weight:500;font-size:.75rem;opacity:.7}
.msg{all:unset;box-sizing:border-box;cursor:pointer;display:grid;align-self:flex-start;max-width:85%;padding:12px 16px 8px;background:#fff;color:var(--verde);border:2.5px solid var(--verde);border-radius:18px 18px 18px 4px;font-weight:700;font-size:clamp(1.05rem,1.8vw,1.25rem);line-height:1.3;transition:background .25s ease,transform .25s ease}
.msg:nth-child(3){transform:rotate(1deg)} .msg:nth-child(4){transform:rotate(-1deg)}
.msg > span{grid-area:1/1;transition:opacity .25s ease,transform .25s ease}
.msg .despues{opacity:0;transform:translateY(6px)}
.msg time{grid-area:2/1;justify-self:end;font-family:var(--f-mono);font-weight:400;font-size:.68rem;opacity:.65;margin-top:4px}
.msg time .d{display:none}
.msg:hover,.msg:focus-visible,.msg.feliz{background:var(--amarillo);transform:rotate(-1.5deg) scale(1.03)}
.msg:hover .antes,.msg:focus-visible .antes,.msg.feliz .antes{opacity:0;transform:translateY(-6px)}
.msg:hover .despues,.msg:focus-visible .despues,.msg.feliz .despues{opacity:1;transform:none}
.msg:hover time .a,.msg:focus-visible time .a,.msg.feliz time .a{display:none}
.msg:hover time .d,.msg:focus-visible time .d,.msg.feliz time .d{display:inline}
.msg:focus-visible{outline:3px solid var(--rojo);outline-offset:3px}
@media (max-width:820px){.zocalo .wrap{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.msg,.msg > span{transition:none}.msg:hover,.msg.feliz,.msg:focus-visible{transform:none}}
.obras{display:grid;gap:0;margin-top:8px}
.obra{padding:26px 0 30px;border-bottom:2.5px dashed var(--grid-strong);scroll-margin-top:24px;min-width:0}
.obra:last-child{border-bottom:0;padding-bottom:6px}
.obra-h{font-family:var(--f-block);font-weight:400;font-size:clamp(1.4rem,3vw,2.1rem);line-height:1.05;margin:0 0 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;text-wrap:balance}
.obra .desc{margin-bottom:18px}
.sello{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;background:var(--verde);color:var(--amarillo);padding:.4em .7em}

/* ---------- Trabajos interactivos ---------- */
.controles{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.mapa-wrap{background:#fff;border:3px solid var(--verde);max-width:640px}
.lienzo-mapa{aspect-ratio:841.89/1190.55;max-width:100%}
.lienzo-mapa svg{display:block;width:100%;height:auto}
.visor{position:fixed;inset:0;z-index:50;background:rgba(25,83,43,.92);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.visor-bar{display:flex;justify-content:flex-end;margin-bottom:10px}
.visor-img{flex:1;overflow:auto;display:flex;justify-content:center}
.visor-img img{background:#fff;width:auto;height:auto;max-width:none;min-width:min(100%,900px);max-height:none}
.laminas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,24px);max-width:820px;align-items:start}
.laminas figure{margin:0}
.laminas img{display:block;width:100%;height:auto;background:#fff;border:3px solid var(--verde)}
.laminas figcaption,.foto6 figcaption{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
.sub{font-family:var(--f-block);font-weight:400;font-size:1.2rem;margin:30px 0 12px}
.comp{position:relative;background:#fff;border:3px solid var(--verde);aspect-ratio:1800/1288;max-width:100%}
.comp img,.comp svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.comp .comp-color{opacity:0}
.comp-trazos path{fill:none;stroke:#1c1c1a;stroke-linecap:round;stroke-linejoin:round}
.telones{display:grid;gap:clamp(26px,4vw,44px);max-width:980px}
.foto6{margin:0;min-width:0}
.foto6 figcaption{margin:0 0 8px;font-family:var(--f-block);font-size:1.05rem;letter-spacing:.02em;text-transform:none}
.telon{--p:0%;position:relative;width:100%;max-width:100%;overflow:hidden;border:3px solid var(--verde);cursor:ew-resize;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#ddd}
.telon img{position:absolute;inset:0;width:100%;height:100%;display:block;max-width:none;pointer-events:none}
.telon .ed{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.telon .linea{position:absolute;top:0;bottom:0;left:var(--p);width:4px;margin-left:-2px;background:var(--amarillo);box-shadow:0 0 0 1px rgba(25,83,43,.35)}
.telon .asa{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--amarillo);color:var(--verde);border:2.5px solid var(--verde);font-size:.7rem;font-weight:800;padding:.5em .55em;white-space:nowrap;letter-spacing:.1em}
.telon.anim .ed{transition:clip-path .45s cubic-bezier(.3,.7,.3,1)}
.telon.anim .linea{transition:left .45s cubic-bezier(.3,.7,.3,1)}
.telon .et{position:absolute;top:10px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;padding:.35em .6em;border:2px solid var(--verde);pointer-events:none}
.telon .et-ed{left:10px;background:var(--amarillo);color:var(--verde)}
.telon .et-or{right:10px;background:var(--crema);color:var(--verde)}
.barra{display:flex;align-items:center;gap:12px;margin-top:10px;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
.barra input{flex:1;min-width:0;accent-color:var(--verde)}
@media (max-width:560px){.laminas{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.telon.anim .ed,.telon.anim .linea{transition:none}}

/* ---------- Visor 3D ---------- */
.visor3d{position:relative;border:3px solid var(--verde);background:#f8f2e2;max-width:100%}
.v3-lienzo{aspect-ratio:16/10;min-height:280px;max-height:78vh;width:100%;touch-action:pan-y}
.visor3d.explorando .v3-lienzo{touch-action:none;cursor:grab}
.v3-entrar{all:unset;box-sizing:border-box;position:absolute;inset:0;z-index:2;cursor:pointer;display:grid;place-items:end start;padding:12px;background:rgba(248,242,226,.0);transition:background .2s ease}
.v3-entrar:hover{background:rgba(25,83,43,.06)}
.v3-entrar span{display:inline-flex;align-items:center;gap:.45em;font-family:var(--f-block);font-size:.78rem;background:var(--amarillo);color:var(--verde);border:2px solid var(--verde);padding:.5em .75em;transform:rotate(-1deg);box-shadow:0 8px 18px -10px rgba(25,40,20,.6)}
.v3-entrar:hover span{background:var(--verde);color:var(--amarillo)}
.v3-entrar:focus-visible span{outline:3px solid var(--naranja);outline-offset:3px}
.visor3d.explorando .v3-entrar{display:none}
.v3-salir{position:absolute;top:10px;right:10px;z-index:3}
.visor3d:not(.explorando) .v3-salir{display:none}
.visor3d.explorando{outline:4px solid var(--amarillo);outline-offset:-4px}
.v3-lienzo:active{cursor:grabbing}
.v3-lienzo canvas{display:block;width:100%!important;height:100%!important}
.v3-estado{position:absolute;inset:0;z-index:4;display:grid;place-items:center;text-align:center;padding:20px;font-family:var(--f-mono);font-size:.85rem;letter-spacing:.06em;color:var(--verde);background:#f8f2e2}
.v3-estado.error{font-family:var(--f-body);letter-spacing:0;font-size:1rem}
.v3-ayuda{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.04em;margin:10px 0 0;opacity:.85}
.v3-nota{font-size:.9rem;margin:12px 0 0;max-width:70ch}
.visor3d.de-noche{border-color:#0b1424}
.boton-noche[aria-pressed="true"]{background:#0b1424;color:var(--amarillo)}
.v3-nota code{font-family:var(--f-mono);font-size:.78em;background:var(--amarillo);color:var(--verde);border:1.5px solid var(--verde);padding:.05em .35em;margin:2px 2px;display:inline-block;overflow-wrap:anywhere}
.obra.destacada{background:var(--verde);color:var(--crema);margin:14px -20px 0;padding:28px 20px 30px;border-bottom:0}
.obra.destacada .obra-h{color:var(--amarillo);font-size:clamp(1.8rem,4.4vw,3rem)}
.obra.destacada .sello{background:var(--amarillo);color:var(--verde)}
.obra.destacada .visor3d{border-color:var(--amarillo);border-width:4px}
.obra.destacada .tag{border-color:var(--crema)}
.obra.destacada .tag.crema{background:var(--crema);color:var(--verde)}
.obra.destacada .tag.verde{background:var(--amarillo);color:var(--verde)}
.desglose{margin-top:24px;padding-top:20px;border-top:2.5px dashed var(--grid-strong)}
.desglose-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.desglose h4{font-family:var(--f-block);font-weight:400;font-size:1.3rem;margin:0;color:var(--verde)}
.desglose .barra input{accent-color:var(--verde)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:.5em .8em;border:2.5px solid var(--verde);font-weight:700;color:var(--verde);background:var(--crema)}
.chip i{width:14px;height:14px;border:1.5px solid var(--verde);display:inline-block}
.chip small{font-family:var(--f-mono);font-weight:400;font-size:.72rem;opacity:.8}
.chip:hover{background:var(--amarillo)}
.chip[aria-pressed="true"]{background:var(--verde);color:var(--crema)}
.chip[aria-pressed="true"] i{border-color:var(--crema)}
.chip:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}

/* ---------- Muestrarios anillados ---------- */
.muestrarios{display:grid;gap:clamp(36px,6vw,70px);padding:18px 0 10px}
.muestrario{--cw:min(430px,34vw,calc((100svh - 170px)/1.42));display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,290px);gap:clamp(18px,3vw,40px);align-items:center}
.muestrario .mz-escena{justify-self:center}
.mz-escena{padding:calc(var(--cw)*.14) calc(var(--cw)*.1) 14px calc(var(--cw)*.44);min-width:0}
.mz-mazo{position:relative;width:var(--cw);height:calc(var(--cw)*var(--r,1.42));touch-action:pan-y}
.muestrario.apaisado{--cw:min(600px,44vw,calc((100svh - 190px)/var(--r)))}
.mz-carta{all:unset;box-sizing:border-box;position:absolute;inset:0;display:flex;flex-direction:column;cursor:pointer;background:#fffdf7;
  border:2.5px solid var(--verde);transform-origin:26px calc(100% - 26px);box-shadow:0 2px 0 rgba(25,83,43,.18),0 10px 22px -12px rgba(25,40,20,.45);
  transition:transform .62s cubic-bezier(.34,1.45,.5,1),box-shadow .3s ease}
.mz-carta:focus-visible{outline:3px solid var(--naranja);outline-offset:3px}
.mz-carta:not(.activa):hover{box-shadow:0 2px 0 rgba(25,83,43,.18),0 14px 26px -10px rgba(25,40,20,.55)}
.mz-papel{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;background:#fff}
.mz-papel img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;pointer-events:none;user-select:none}
.mz-pie{flex:none;display:flex;flex-direction:column;gap:2px;padding:9px 12px 10px 54px;background:var(--mz);color:var(--mz-t);border-top:2.5px solid var(--verde);min-height:54px}
.mz-pie b{font-family:var(--f-mono);font-weight:500;font-size:.68rem;letter-spacing:.14em}
.mz-pie span{font-family:var(--f-block);font-size:.86rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mz-agujero{position:absolute;left:15px;bottom:15px;width:22px;height:22px;border-radius:50%;background:var(--crema);border:2.5px solid var(--verde);box-shadow:inset 1px 2px 3px rgba(0,0,0,.3)}
.mz-anillo{position:absolute;left:9px;bottom:9px;width:34px;height:34px;border-radius:50%;z-index:60;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,transparent 0 9px,#7a8288 9.5px,#f2f4f5 11px,#b9c0c5 13px,#6c747a 15.5px,transparent 16px);
  filter:drop-shadow(1px 2px 1.5px rgba(0,0,0,.35))}
.mz-carta.sacude{animation:mzSacude .7s ease}
@keyframes mzSacude{0%{rotate:0deg}25%{rotate:-2.2deg}50%{rotate:1.6deg}75%{rotate:-.8deg}100%{rotate:0deg}}
.mz-info{min-width:0;max-width:36ch;display:grid;gap:10px;align-content:start}
.mz-rotulo{justify-self:start;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;background:var(--mz);color:var(--mz-t);border:2px solid var(--verde);padding:.3em .65em;transform:rotate(-1.5deg)}
.mz-tema{font-family:var(--f-display);font-weight:400;font-size:clamp(1.5rem,2.4vw,2.1rem);line-height:1;margin:0;color:var(--verde)}
.mz-texto{min-height:7.5em}
.mz-texto h5{font-family:var(--f-block);font-weight:400;font-size:clamp(1rem,1.5vw,1.15rem);line-height:1.15;margin:2px 0 6px}
.mz-texto p{margin:0;font-size:.93rem;line-height:1.55}
.mz-nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.mz-nav .tag.sm{font-size:.78rem;padding:.5em .75em;border-width:2px}
.mz-cont{font-family:var(--f-mono);font-size:.85rem;letter-spacing:.08em;min-width:3.5em;text-align:center}
.mz-indice{display:none!important}
.mz-indice-x{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;border-top:2px dashed var(--grid-strong);padding-top:10px}
.mz-indice button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.84rem;padding:3px 0;color:var(--verde)}
.mz-indice button span{flex:none;width:21px;height:21px;display:grid;place-items:center;border:2px solid var(--verde);font-family:var(--f-mono);font-size:.72rem}
.mz-indice button[aria-current="true"]{font-weight:800}
.mz-indice button[aria-current="true"] span{background:var(--mz);color:var(--mz-t)}
.mz-indice button:focus-visible,.mz-grande:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.mz-grande{all:unset;cursor:pointer;justify-self:start;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-decoration:underline;text-underline-offset:3px}
.visor-foto{align-items:center}
.visor-foto img{min-width:0;max-width:100%;max-height:100%;object-fit:contain;background:#fff}
@media (max-width:760px){.muestrario{grid-template-columns:1fr;justify-items:center}.muestrario,.muestrario.apaisado{--cw:clamp(150px,calc((100vw - 104px)/1.56),340px)}.mz-info{justify-self:stretch;max-width:none}.mz-texto{min-height:0}}
@media (prefers-reduced-motion:reduce){.mz-carta{transition:none}.mz-carta.sacude{animation:none}}

/* ---------- Cuadernos de dibujo (Plástica I) ---------- */
.cuadernos{display:grid;gap:clamp(40px,7vw,80px);padding:22px 0 10px}
.cuaderno,.proceso{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,290px);gap:clamp(18px,3vw,40px);align-items:center}
.cuaderno .cu-escena{justify-self:center}
.cu-escena{--pw:min(540px,52vw,calc((100svh - 160px)/var(--r)));padding:30px 14px 22px 8px;perspective:1800px}
.apaisado .cu-escena{--pw:min(780px,62vw,calc((100svh - 160px)/var(--r)))}
.cu-libro{position:relative;width:var(--pw);height:calc(var(--pw)*var(--r));transform-style:preserve-3d;touch-action:pan-y;transform:rotate(-1.5deg)}
.cu-fondo{position:absolute;inset:0;background:#fffdf7;border:2.5px solid var(--verde);
  box-shadow:3px 3px 0 #efe6cf,3px 3px 0 2.5px var(--verde),6px 6px 0 #efe6cf,6px 6px 0 5px var(--verde),0 18px 30px -16px rgba(25,40,20,.55)}
.cu-hoja{all:unset;box-sizing:border-box;position:absolute;inset:0;cursor:pointer;background:#fffdf7;border:2.5px solid var(--verde);
  transform-origin:50% 0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .8s cubic-bezier(.5,.05,.3,1);display:flex;flex-direction:column}
.cu-hoja.dada{transform:rotateX(178deg);pointer-events:none}
.cu-hoja:focus-visible{outline:3px solid var(--naranja);outline-offset:3px}
.cu-papel{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:28px 10px 22px;
  background:linear-gradient(transparent 0 0),#fffdf7}
.cu-papel img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;pointer-events:none;user-select:none;mix-blend-mode:multiply}
.cu-folio{position:absolute;right:12px;bottom:8px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;color:var(--verde);opacity:.7}
.cu-tapa{background:var(--cu);color:var(--cu-t);align-items:center;justify-content:center;
  background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 3px,transparent 3px 9px)}
.cu-etiqueta{display:grid;gap:4px;text-align:center;background:var(--crema);color:var(--verde);border:2.5px solid var(--verde);padding:16px 22px 14px;transform:rotate(-2deg);max-width:80%}
.cu-etiqueta small{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}
.cu-etiqueta b{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1}
.cu-etiqueta i{font-style:normal;font-family:var(--f-mono);font-size:.72rem}
.cu-cinta{position:absolute;width:90px;height:26px;background:rgba(230,211,163,.9);top:40%;right:-18px;transform:rotate(38deg)}
.cu-abrir{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;opacity:.85}
.cu-espiral{position:absolute;left:10px;right:10px;top:-14px;height:30px;z-index:300;pointer-events:none;transform:translateZ(2px);
  background:radial-gradient(ellipse 5px 11px at 50% 50%,transparent 0 3px,#6c747a 3.5px,#eef1f3 5px,#8e979d 6.5px,transparent 7px) 0 0/18px 30px repeat-x;
  filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.cu-espiral::before{content:"";position:absolute;left:0;right:0;top:19px;height:8px;
  background:radial-gradient(circle at 50% 50%,var(--verde) 0 3px,transparent 3.5px) 0 0/18px 8px repeat-x;opacity:.75}
/* proceso de la letra */
.pr-marco{--pw:clamp(200px,32vw,380px);position:relative;width:var(--pw);padding:14px;background:#fffdf7;border:2.5px solid var(--verde);box-shadow:0 18px 30px -16px rgba(25,40,20,.55);perspective:1200px;margin:18px 8px}
.pr-hoja{position:relative;aspect-ratio:900/1400;display:grid}
.pr-hoja img{grid-area:1/1;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s ease;mix-blend-mode:multiply}
.pr-hoja img.on{opacity:1}
.pr-sello{position:absolute;top:-16px;left:-12px;background:var(--cu);color:var(--cu-t);border:2.5px solid var(--verde);font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;padding:.35em .7em;transform:rotate(-4deg);z-index:2}
.pr-sello b{font-family:var(--f-block);font-weight:400;font-size:1.1rem}
.pr-intro{margin:0;font-size:1.02rem;line-height:1.6}
.pr-pasos{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:4px}
.pr-pasos li{display:grid;gap:4px}
.pr-pasos button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:8px;border:2.5px solid transparent;color:var(--verde)}
.pr-pasos button img{flex:none;width:46px;height:60px;object-fit:cover;border:2px solid var(--verde);background:#fff}
.pr-pasos button span{display:grid;gap:2px;min-width:0}
.pr-pasos button b{font-family:var(--f-block);font-weight:400;font-size:1rem}
.pr-pasos button small{font-size:.86rem;line-height:1.35;opacity:.85}
.pr-pasos button[aria-current="true"]{border-color:var(--verde);background:var(--cu);color:var(--cu-t)}
.pr-pasos button:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.pr-flecha{font-style:normal;font-family:var(--f-mono);font-size:.9rem;padding-left:26px;opacity:.7;line-height:1}
.pr-barra input{accent-color:var(--naranja)}
@media (max-width:760px){.cuaderno,.proceso{grid-template-columns:1fr;justify-items:center}.cu-escena{--pw:min(calc(100vw - 96px),440px,calc((100svh - 140px)/var(--r)))}.apaisado .cu-escena{--pw:calc(100vw - 96px)}.cu-info,.pr-info{justify-self:stretch;max-width:none}}
@media (prefers-reduced-motion:reduce){.cu-hoja{transition:none}}

/* ---------- Materias como páginas ---------- */
.cabecera .materia-chip{align-self:flex-start;order:-1;flex-basis:100%;width:max-content}
.mat-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:clamp(14px,2vw,22px);max-width:1240px}
.mat-link{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;gap:6px 12px;min-height:170px;padding:18px 18px 16px;
  border:3px solid var(--verde);background:var(--crema);color:var(--verde);text-decoration:none;transition:transform .18s ease,background .18s ease}
.mat-link:hover{transform:rotate(var(--rot)) translateY(-3px);background:var(--amarillo)}
.mat-link .mat-num{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.12em;grid-column:1/-1}
.mat-link .mat-nombre{font-family:var(--f-block);font-size:clamp(1.3rem,2.4vw,1.75rem);line-height:1.05;align-self:end;text-wrap:balance}
.mat-link small{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.08em;grid-row:3}
.mat-link .mas{grid-row:2/4;grid-column:2;align-self:end;width:38px;height:38px;border:2.5px solid var(--verde);display:grid;place-items:center;font-weight:800;font-size:1.2rem;background:var(--amarillo)}
.mat-link:hover .mas{background:var(--verde);color:var(--amarillo)}
.mat-link.vacia{opacity:.62}
.materia-pagina{border:0;background:none}
.materia-pagina .mat-cuerpo{border:0;padding:0}
.fin-materia{margin-top:clamp(40px,7vw,80px);padding:clamp(22px,4vw,36px);border:3px solid var(--verde);background:var(--verde);color:var(--crema);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 24px;max-width:1240px}
.fin-materia p{margin:0;font-family:var(--f-display);font-size:clamp(1.5rem,3.2vw,2.3rem);line-height:1.05;color:var(--amarillo)}
.fin-botones{display:flex;flex-wrap:wrap;gap:12px}
.fin-materia .tag{border-color:var(--crema)}
.fin-materia .tag.verde{background:var(--amarillo);color:var(--verde)}
.fin-materia .tag:not(.verde){background:transparent;color:var(--crema)}
.fin-materia .tag:hover{background:var(--crema);color:var(--verde)}

/* ---------- Planos estilo AutoCAD (Instalaciones III) ---------- */
.cads{display:grid;gap:clamp(36px,6vw,64px);max-width:1240px;padding-top:6px}
.cad{--cad-bg:#ffffff;--cad-ui:#e7eaee;--cad-ui2:#f3f4f6;--cad-borde:#b9c0c8;--cad-txt:#20262d;--cad-dim:#66707b;display:grid;gap:12px;scroll-margin-top:20px}
.cad{grid-template-columns:minmax(0,1fr)}
.cad-h{min-width:0;overflow-wrap:anywhere}
.cad-cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.cad-h{margin:0;font-family:var(--f-block);font-weight:400;font-size:clamp(1.4rem,2.6vw,2rem);line-height:1;display:flex;align-items:baseline;gap:12px}
.cad-h span{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.12em;opacity:.75}
.cad-grupo{display:flex;flex-wrap:wrap;align-items:center}
.cad-grupo button{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--f-mono);font-size:.84rem;padding:.5em .95em;border:2px solid var(--verde);margin-left:-2px;background:var(--crema);color:var(--verde)}
.cad-grupo button:first-child{margin-left:0}
.cad-grupo button[aria-pressed="true"]{background:var(--verde);color:var(--crema)}
.cad-grupo button:hover:not([aria-pressed="true"]){background:var(--amarillo)}
.cad-grupo button:focus-visible{outline:3px solid var(--naranja);outline-offset:2px;position:relative;z-index:1}
.cad-ventana{border:1.5px solid var(--cad-borde);background:var(--cad-bg);color:var(--cad-txt);font-family:var(--f-mono);box-shadow:0 14px 28px -20px rgba(0,0,0,.5)}
.cad-barra{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--cad-ui);padding:6px 12px;font-size:.75rem;border-bottom:1px solid var(--cad-borde)}
.cad-archivo{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cad-pest{background:var(--cad-bg);border:1px solid var(--cad-borde);border-bottom:0;padding:3px 10px;font-size:.7rem;color:var(--cad-dim)}
.cad-lienzo{position:relative;height:min(72vh,760px);min-height:340px;overflow:hidden;touch-action:pan-y;outline:none;background:var(--cad-bg)}
.cad-lienzo.cad-activo{touch-action:none;box-shadow:inset 0 0 0 2px var(--amarillo)}
.cad-lienzo.cad-encima{cursor:none}
.cad-lienzo.cad-mano{cursor:none}
.cad-svg{position:absolute;inset:0}
.cad-svg svg{display:block;width:100%;height:100%}
.cad-cargando{margin:0;position:absolute;inset:0;display:grid;place-items:center;color:var(--cad-dim);font-size:.85rem}
.cad-cruz{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none}
.cad-lienzo.cad-encima .cad-cruz{display:block}
.cad-cruz line,.cad-cruz .pick{stroke:#1a1a1a;stroke-width:1;fill:none;shape-rendering:crispEdges}
.cad-ucs{position:absolute;left:12px;bottom:10px;width:46px;height:46px;pointer-events:none;opacity:.8}
.cad-aviso{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:.72rem;color:var(--cad-txt);background:rgba(243,244,246,.95);border:1px solid var(--cad-borde);padding:5px 10px;pointer-events:none;opacity:0;transition:opacity .2s ease;white-space:nowrap}
.cad-lienzo.cad-encima:not(.cad-activo) .cad-aviso{opacity:1}
.cad-salir{all:unset;position:absolute;top:10px;right:10px;z-index:3;cursor:pointer;font-family:var(--f-mono);font-size:.74rem;padding:5px 10px;background:var(--amarillo);color:var(--verde);border:2px solid var(--verde)}
.cad-salir:hover{background:var(--verde);color:var(--amarillo)}
.cad-salir:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.cad-lienzo:not(.cad-activo) .cad-salir{display:none}
.cad-lienzo.cad-activo .cad-salir{cursor:pointer}
.cad-lienzo:not(.cad-activo):focus-visible{box-shadow:inset 0 0 0 2px var(--naranja)}
.cad-estado{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:var(--cad-ui2);border-top:1px solid var(--cad-borde);padding:6px 12px;font-size:.74rem;font-variant-numeric:tabular-nums}
.cad-cmd{flex:1 1 180px;min-width:0}
.cad-coord,.cad-zoom{color:var(--cad-dim)}
.cad-botones{display:flex;gap:6px}
.cad-botones button{all:unset;cursor:pointer;padding:3px 9px;border:1px solid var(--cad-borde);background:#fff;color:var(--cad-txt);font-size:.72rem}
.cad-botones button:hover{background:var(--cad-ui)}
.cad-botones button:focus-visible{outline:2px solid var(--naranja)}
.cad-ayuda{margin:0;font-size:.86rem;opacity:.85;max-width:80ch}
@media (max-width:640px){.cad-lienzo{height:62vh}.cad-coord{display:none}}

/* ---------- Sobre mí: mesa con polaroids ---------- */
@media (min-width:821px){.sobre-grid{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}}
.mesa{position:relative;width:100%;max-width:560px;aspect-ratio:1/1.38;justify-self:center}
.mesa figure{position:absolute;margin:0;transform:rotate(var(--r));transition:transform .3s cubic-bezier(.3,1.4,.5,1),box-shadow .3s ease}
.pola{background:#fbfaf6;padding:1.6% 1.6% 0;width:44%;box-shadow:0 10px 22px -10px rgba(0,0,0,.6);z-index:3}
.pola img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1)}
.pola figcaption{font-family:"Shrikhand",var(--f-display);color:var(--verde);font-size:clamp(.78rem,1.25vw,.98rem);text-align:center;padding:.3em 0 .38em;line-height:1}
.pola .cinta{position:absolute;width:38%;height:9%;background:rgba(230,211,163,.88);top:-4%;left:31%;transform:rotate(-4deg)}
.pola-1{left:2%;top:2%;z-index:4}
.pola-2{left:52%;top:13%;z-index:5}
.pola-3{left:22%;top:57%;z-index:6}
.pola:hover{transform:rotate(0deg) scale(1.05);z-index:9;box-shadow:0 18px 30px -12px rgba(0,0,0,.65)}
.dib{background:transparent;padding:0;box-shadow:0 6px 14px -8px rgba(0,0,0,.55);z-index:1;opacity:.92}
.dib img{display:block;width:100%;height:auto}
.dib-1{width:30%;right:0;top:0}
.dib-2{width:19%;left:0;top:41%}
.dib-3{width:30%;right:-1%;top:58%}
.dib-4{width:28%;right:2%;bottom:4%}
.dib:hover{transform:rotate(0deg) scale(1.5);z-index:10;opacity:1}
@media (max-width:820px){.mesa{max-width:440px}}
@media (prefers-reduced-motion:reduce){.mesa figure{transition:none}}

/* ---------- Sala de exposición (Plástica II) ---------- */
.sala{display:grid;gap:clamp(40px,7vw,80px);padding-top:10px;max-width:1240px}
.expo{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,290px);gap:clamp(18px,3vw,40px);align-items:center}
.ex-pared{position:relative;background:#fff;border:3px solid var(--verde);aspect-ratio:4/3.1;max-height:80vh;width:100%;max-width:100%;overflow:hidden;
  box-shadow:inset 0 -60px 60px -50px rgba(0,0,0,.08)}
.ex-obra{position:absolute;inset:3% 20% 10%;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);z-index:1}
.ex-obra img{grid-area:1/1;width:100%;height:100%;min-height:0;min-width:0;object-fit:contain;opacity:0;mix-blend-mode:multiply;user-select:none;pointer-events:none}
.ex-obra img.on{opacity:1}
.ex-base{position:absolute;left:50%;bottom:0;width:44%;height:9%;transform:translateX(-50%);z-index:2;background:linear-gradient(#f1ede4,#e2dccf);border:2px solid var(--verde);border-bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ex-disco{display:flex;gap:9px}
.ex-disco i{width:9px;height:9px;border-radius:50%;border:2px solid var(--verde);background:transparent;transition:background .3s ease,transform .3s ease}
.ex-disco i.on{background:var(--naranja);border-color:var(--naranja);transform:scale(1.25)}
.ex-mano{position:absolute;right:12px;top:12px;z-index:3;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;background:var(--amarillo);color:var(--verde);border:2px solid var(--verde);padding:4px 8px;pointer-events:none}
[data-giro]{cursor:grab;touch-action:pan-y}
[data-giro].girando{cursor:grabbing}
[data-giro]:focus-visible{outline:3px solid var(--naranja);outline-offset:3px}
.ex-techo{aspect-ratio:3/2;background:linear-gradient(#fff 0 85%,#f6f3ec)}
.ex-techo::before{content:"";position:absolute;left:0;right:0;top:0;height:4%;background:#efebe2;border-bottom:1px solid #e2ddd0;z-index:2}
.ex-mov{position:absolute;left:50%;top:0;height:96%;aspect-ratio:1536/1024;max-width:96%;transform:translateX(-50%);z-index:1}
.ex-mov .capa{position:absolute;inset:0;will-change:transform}
.ex-mov .capa-img{position:absolute;inset:0;width:100%;height:100%;max-width:none;user-select:none;pointer-events:none}
.cartela{background:#fbfaf6;border:2px solid var(--verde);padding:18px 18px 16px;display:grid;gap:8px;align-content:start;box-shadow:0 8px 18px -14px rgba(0,0,0,.5);min-width:0}
.cartela .mz-rotulo{justify-self:start}
.cartela-t{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,2.6vw,2.2rem);line-height:1;color:var(--verde)}
.cartela-sub{margin:0;font-family:var(--f-mono);font-size:.76rem;letter-spacing:.04em;opacity:.8}
.cartela-d{margin:4px 0 6px;font-size:.92rem;line-height:1.55}
.cartela .tag{justify-self:start}
@media (max-width:760px){.expo{grid-template-columns:1fr}.ex-pared:not(.ex-techo){aspect-ratio:4/5}.ex-obra{inset:9% 8% 11%}.ex-base{width:70%}.ex-mano{font-size:.64rem;top:8px;right:8px}}
@media (prefers-reduced-motion:reduce){.ex-disco i{transition:none}}

.es-maqueta .ex-pared{aspect-ratio:4/3;background:linear-gradient(#fbfaf6,#efe9dc)}
.es-maqueta .ex-obra{inset:4% 3% 9%}
.es-maqueta .ex-obra img{mix-blend-mode:normal;filter:drop-shadow(0 14px 18px rgba(40,30,15,.35))}
.es-maqueta .ex-base{width:22%;height:7%;background:transparent;border:0}
.cads + .sala{margin-top:clamp(40px,7vw,80px)}

/* ---------- Renders (rollo de película) ---------- */
.cine{margin-top:clamp(30px,5vw,50px);display:grid;gap:12px}
.cine-pantalla{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:var(--verde);border:3px solid var(--verde)}
.cine-pantalla img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease}
.cine-pantalla img.on{opacity:1}
.cine-pantalla img.kb{animation:kb 12s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.08) translate(-1.5%,-1%)}}
.cine-cartel{position:absolute;left:14px;bottom:14px;background:var(--amarillo);color:var(--verde);border:2px solid var(--verde);font-family:var(--f-mono);font-size:.8rem;padding:.4em .7em;display:flex;gap:.6em}
.cine-cartel b{font-family:var(--f-block);font-weight:400}
.cine-flecha{all:unset;position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;cursor:pointer;background:rgba(243,232,204,.9);color:var(--verde);border:2px solid var(--verde);font-size:1.6rem;line-height:1}
.cine-flecha.izq{left:10px}.cine-flecha.der{right:10px}
.cine-flecha:hover{background:var(--amarillo)}
.cine-flecha:focus-visible,.cine-cuadro:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}
.cine-rollo{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px 14px;padding:6px 2px 0}
.cine-cuadro{all:unset;box-sizing:border-box;position:relative;display:grid;gap:6px;cursor:pointer;padding:6px 6px 8px;background:#fbfaf6;border:2.5px solid var(--verde);transform:rotate(var(--r));transition:transform .2s ease,background .2s ease}
.cine-cuadro img{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;display:block}
.cine-cuadro i{position:absolute;left:-8px;top:-10px;font-style:normal;font-family:var(--f-mono);font-size:.7rem;background:var(--amarillo);color:var(--verde);border:2px solid var(--verde);padding:1px 6px}
.cine-cuadro span{font-family:var(--f-block);font-size:.78rem;line-height:1.1;color:var(--verde)}
.cine-cuadro:hover{transform:rotate(0) translateY(-3px)}
.cine-cuadro[aria-current="true"]{background:var(--verde);transform:rotate(0) translateY(-3px)}
.cine-cuadro[aria-current="true"] span{color:var(--crema)}
.cine-cartel{transform:rotate(-1.5deg)}
.cine-cartel span{font-family:var(--f-block);font-size:.82rem}
@media (max-width:640px){.cine-rollo{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.cine-pantalla img{transition:none}.cine-pantalla img.kb{animation:none}}

/* ---------- Ficha de la materia ---------- */
.ficha{display:grid;grid-template-columns:auto minmax(0,1fr);border:3px solid var(--verde);background:#fbfaf6;max-width:980px;margin:0 0 clamp(28px,5vw,48px)}
.ficha-anio{background:var(--amarillo);border-right:3px solid var(--verde);padding:16px 22px;display:grid;align-content:center;justify-items:center;gap:2px}
.ficha-anio span,.ficha-cuerpo span{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.ficha-anio b{font-family:var(--f-block);font-weight:400;font-size:clamp(1.8rem,3.5vw,2.4rem);line-height:1}
.ficha-cuerpo{padding:16px 22px;display:grid;gap:10px}
.ficha-cuerpo p{margin:0;font-size:1rem;line-height:1.5;max-width:68ch}
.ficha-cuerpo span{display:block;margin-bottom:2px;opacity:.75}
@media (max-width:560px){.ficha{grid-template-columns:1fr}.ficha-anio{border-right:0;border-bottom:3px solid var(--verde);justify-items:start;grid-auto-flow:column;justify-content:start;align-items:baseline;gap:12px}}

/* ---------- Malla y contacto ---------- */

.contacto{margin:26px 0 8px;border-top:2.5px dashed rgba(243,232,204,.45);padding-top:18px}

.contacto li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}

.contacto li b{font-weight:700;user-select:all;overflow-wrap:anywhere}
.contacto a{color:var(--amarillo);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.contacto button:hover{background:var(--crema);color:var(--verde)}
.contacto a:focus-visible,.contacto button:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}

/* ---- Mapa: las líneas se dibujan desde sus puntos de inicio ---- */
let mapaTxt=null;
async function initMapa(el){
  if(el.dataset.ok)return; el.dataset.ok=1;
  try{ mapaTxt=mapaTxt||await (await fetch('mapa.svg')).text() }catch(e){ el.innerHTML='<p class="vacio">No se pudo cargar el mapa.</p>';return }
  el.innerHTML=mapaTxt;
  const svg=el.querySelector('svg'); svg.setAttribute('width','100%'); svg.removeAttribute('height');
  const rutas=[...svg.querySelectorAll('path[stroke-width="20"]')];
  const marcas=[...svg.querySelectorAll('path')].filter(p=>!p.closest('defs')&&!rutas.includes(p)&&(/100%, 100%, 100%|61.569/.test(p.getAttribute('fill')||'')||p.getAttribute('stroke-width')==='1'));
  el._mapa={rutas,marcas,anims:[]};
  dibujarMapa(el);
}
function dibujarMapa(el){
  const m=el._mapa; if(!m)return;
  m.anims.forEach(a=>a.cancel()); m.anims=[];
  if(RM()){m.marcas.forEach(p=>p.style.opacity=1);return}
  const orden={'55.686951':0,'56.079102':0,'41.567993':1,'41.175842':1,'96.862793':2};
  let fin=0;
  m.rutas.forEach(p=>{
    const L=p.getTotalLength(); const g=orden[(p.getAttribute('stroke').match(/[\d.]+/)||[''])[0]]??1;
    const delay=g*900, dur=Math.max(500,L*2.6);
    p.style.strokeDasharray=L+' '+(L+40);
    m.anims.push(p.animate([{strokeDashoffset:L+1},{strokeDashoffset:0}],{duration:dur,delay,easing:'cubic-bezier(.45,.05,.4,1)',fill:'both'}));
    fin=Math.max(fin,delay+dur);
  });
  m.marcas.forEach((p,i)=>m.anims.push(p.animate([{opacity:0},{opacity:1}],{duration:400,delay:fin*.55+i*25,fill:'both'})));
}
function abrirMapa(){
  const d=document.createElement('div'); d.className='visor'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-label','Mapa completo');
  d.innerHTML=`<div class="visor-bar"><button type="button" class="tag sm" data-accion="cerrar-visor">Cerrar ✕</button></div><div class="visor-img"><img src="mapa.svg" alt="Mapa completo del campus"></div>`;
  document.body.appendChild(d); document.body.style.overflow='hidden'; d.querySelector('button').focus();
}
function cerrarVisor(){const v=document.querySelector('.visor'); if(v){v.remove(); document.body.style.overflow=''}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarVisor()});
document.addEventListener('click',e=>{if(e.target.closest('[data-accion="cerrar-visor"]')||e.target.classList.contains('visor'))cerrarVisor()});

/* ---- Composición: los trazos nacen desde varios puntos ---- */
let compData=null;
const SEMILLAS=[[.5,.97],[.34,.5],[.66,.5],[.24,.82],[.76,.82]];
async function initComp(el){
  if(el.dataset.ok)return; el.dataset.ok=1;
  try{ compData=compData||await (await fetch('composicion-trazos.json')).json() }catch(e){ el.classList.add('listo');return }
  const {w,h,paths}=compData, ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg'); svg.setAttribute('viewBox',`0 0 ${w} ${h}`); svg.setAttribute('class','comp-trazos'); svg.setAttribute('aria-hidden','true');
  const S=SEMILLAS.map(([x,y])=>[x*w,y*h]); const dmin=(p)=>Math.min(...S.map(s=>Math.hypot(p[0]-s[0],p[1]-s[1])));
  const items=paths.map(t=>{
    let pts=t.p; if(dmin(pts[pts.length-1])<dmin(pts[0]))pts=[...pts].reverse();
    const path=document.createElementNS(ns,'path'); path.setAttribute('d','M'+pts.map(q=>q.join(' ')).join('L'));
    path.setAttribute('stroke-width',t.w); svg.appendChild(path); return {path,d:dmin(pts[0])};
  });
  el.appendChild(svg);
  const maxd=Math.max(...items.map(i=>i.d));
  items.forEach(i=>{i.L=i.path.getTotalLength(); i.path.style.strokeDasharray=i.L+' '+(i.L+20); i.delay=i.d/maxd*3600});
  el._comp={items,svg,anims:[],img:el.querySelector('.comp-color')};
  dibujarComp(el);
}
function dibujarComp(el){
  const c=el._comp; if(!c)return; c.anims.forEach(a=>a.cancel()); c.anims=[];
  const btn=el.parentElement.querySelector('[data-accion="comp-pausa"]'); if(btn){btn.textContent='Pausar';btn.setAttribute('aria-pressed','false')}
  if(RM()){c.img.style.opacity=1;c.svg.style.opacity=0;return}
  let fin=0;
  c.items.forEach(i=>{const dur=Math.min(1800,Math.max(350,i.L*3.2));
    c.anims.push(i.path.animate([{strokeDashoffset:i.L+1},{strokeDashoffset:0}],{duration:dur,delay:i.delay,easing:'ease-out',fill:'both'}));fin=Math.max(fin,i.delay+dur)});
  c.anims.push(c.img.animate([{opacity:0},{opacity:1}],{duration:1400,delay:fin,easing:'ease',fill:'both'}));
  c.anims.push(c.svg.animate([{opacity:1},{opacity:0}],{duration:1400,delay:fin+200,easing:'ease',fill:'both'}));
}
function pausarComp(el,btn){
  const c=el._comp; if(!c)return; const pausado=btn.getAttribute('aria-pressed')==='true';
  c.anims.forEach(a=>pausado?a.play():a.pause()); btn.setAttribute('aria-pressed',String(!pausado)); btn.textContent=pausado?'Pausar':'Seguir';
}

/* ---- Telón: original / editada ---- */
function initTelon(t){
  if(t.dataset.ok)return; t.dataset.ok=1;
  const fig=t.closest('.foto6'), range=fig.querySelector('input[type=range]');
  const set=(v,anim)=>{v=Math.max(0,Math.min(100,v)); t.classList.toggle('anim',!!anim); t.style.setProperty('--p',v+'%'); range.value=Math.round(v)};
  const pos=e=>{const r=t.getBoundingClientRect(); return (e.clientX-r.left)/r.width*100};
  let arrastre=false;
  t.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')set(pos(e),true)});
  t.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||arrastre){t.classList.remove('anim');set(pos(e))}});
  t.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')set(0,true)});
  t.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){arrastre=true;set(pos(e),true)}});
  const soltar=()=>{arrastre=false}; t.addEventListener('pointerup',soltar); t.addEventListener('pointercancel',soltar);
  range.addEventListener('input',()=>set(+range.value,false));
  set(0);
}

/* ---- Activar cada trabajo cuando se ve ---- */
const vistos=new IntersectionObserver(es=>es.forEach(en=>{
  if(!en.isIntersecting)return; const el=en.target; vistos.unobserve(el);
  if(el.matches('[data-visor]'))initVisor(el); else if(el.matches('[data-mapa]'))initMapa(el); else if(el.matches('[data-comp]'))initComp(el); else if(el.matches('[data-telon]'))initTelon(el);
}),{threshold:.25});
function activarTrabajos(){ document.querySelectorAll('[data-visor],[data-mapa],[data-comp],[data-telon]').forEach(el=>{if(!el.dataset.ok)vistos.observe(el)}) }
document.addEventListener('click',e=>{
  const v3=e.target.closest('[data-v3]'); if(v3){const box=v3.closest('.obra,main').querySelector('[data-visor]'); if(box)accionVisor(box,v3.dataset.v3,v3); return}
  const b=e.target.closest('[data-accion]'); if(!b)return; const a=b.dataset.accion, obra=b.closest('.obra,main');
  if(a==='mapa-redibujar')dibujarMapa(obra.querySelector('[data-mapa]'));
  else if(a==='mapa-completo')abrirMapa();
  else if(a==='comp-repetir')dibujarComp(obra.querySelector('[data-comp]'));
  else if(a==='comp-pausa')pausarComp(obra.querySelector('[data-comp]'),b);
});

async function initVisor(box){

  const sol=new T.DirectionalLight(0xffffff,DIA.sol);sol.position.set(1,1.6,.8);scene.add(sol);
  const sol2=new T.DirectionalLight(0xffffff,DIA.sol2);sol2.position.set(-1,.4,-1);scene.add(sol2);
  const ctl=new T.OrbitControls(cam,renderer.domElement);
  ctl.enabled=box.classList.contains('explorando');ctl.enableDamping=true;ctl.dampingFactor=.12;ctl.screenSpacePanning=true;ctl.zoomSpeed=1.1;
  const V={T,renderer,scene,cam,ctl,box,lienzo,activo:false,t:0,hemi,sol,sol2};
  box._v=V;
  const tam=()=>{const w=lienzo.clientWidth,h=lienzo.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()};
  new ResizeObserver(tam).observe(lienzo);tam();

    scene.add(model);V.model=model;model.updateMatrixWorld(true);
    V.caja=caja||new T.Box3().setFromObject(model);
    encuadrar(V,V.caja,false);V.inicio={p:cam.position.clone(),t:ctl.target.clone()};

    const man=new T.LoadingManager();

      const model=col.scene;const FORZ={};(box.dataset.forzar||'').split(',').filter(Boolean).forEach(p=>{const [a,b]=p.split(':');FORZ[a]=b});
      model.traverse(o=>{
        if(o.isCamera||o.isLight){o.visible=false}
        if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
          const fz=FORZ[m.name];
          if(fz&&o.geometry){if(!o.geometry.attributes.uv)uvCaja(o.geometry,24);m.map=texProcedural(fz);m.color&&m.color.setHex(0xffffff);m.userData.tex=fz}

    if(!V.rayLento){const t0=performance.now();const hit=ray.intersectObject(V.model,true).find(h=>h.object.isMesh&&h.object.visible);if(performance.now()-t0>60)V.rayLento=true;if(hit)P=hit.point}

/* ---- Paquete comprimido (modelos muy pesados, ej. la chacarera) ---- */
async function cargarPaquete(V,base,progreso,listo,fallo){
  const T=V.T;
  try{
    if(!('DecompressionStream' in window))return fallo('Este navegador es antiguo para abrir este modelo. Probá con Chrome, Firefox o Safari actualizados.');
    const info=await (await fetch(base+'.json')).json();
    const trozos=[];let leidos=0;
    for(let i=0;i<info.partes;i++){
      const txt=await (await fetch(`${base}-${i}.txt`)).text();
      const bin=atob(txt),u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
      trozos.push(u);leidos+=txt.length;progreso(`Cargando modelo… ${Math.round(leidos/info.b64*92)}%`);
    }
    progreso('Armando el modelo…');
    const buf=await new Response(new Blob(trozos).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    const model=new T.Group(),mats=[];
    for(const m of info.mallas){
      const g=new T.BufferGeometry();
      g.setAttribute('position',new T.BufferAttribute(new Uint16Array(buf,m.pos,m.nv*3),3));
      g.setAttribute('normal',new T.BufferAttribute(new Int8Array(buf,m.nrm,m.nv*3),3,true));
      if(m.uv!==undefined)g.setAttribute('uv',new T.BufferAttribute(new Float32Array(buf,m.uv,m.nv*2),2));
      g.setIndex(new T.BufferAttribute(new Uint32Array(buf,m.idx,m.ni),1));
      g.computeBoundingSphere();g.computeBoundingBox();
      const c=m.color||[.8,.8,.8,1],alpha=Math.min(c[3]??1,m.alpha??1);
      const mat=new T.MeshLambertMaterial({color:new T.Color(c[0],c[1],c[2]),side:T.DoubleSide,name:m.mat});
      if(m.tex)aplicarTextura(mat,(m.tex||'')+' '+m.mat,m.uv!==undefined);
      if(!mat.map)suavizar(mat);
      if(alpha<.99){mat.transparent=true;mat.opacity=Math.max(alpha,.18);mat.depthWrite=false}
      if(m.luz){mat.userData.luz=true;mat.userData.azul=/blue/i.test(m.mat)}
      const mesh=new T.Mesh(g,mat);mesh.scale.setScalar(info.q);mesh.position.fromArray(info.min);
      if(mat.transparent)mesh.renderOrder=2;
      model.add(mesh);mats.push(mat);
    }
    if(info.lineas){const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(new Uint16Array(buf,info.lineas.pos,info.lineas.n*3),3));
      const l=new T.LineSegments(g,new T.LineBasicMaterial({color:0x222222,transparent:true,opacity:.6}));l.scale.setScalar(info.q);l.position.fromArray(info.min);model.add(l);V.lineas=l}
    V.mats=mats;V.luces=info.luces||[];
    const caja=info.caja?new T.Box3(new T.Vector3().fromArray(info.caja[0]),new T.Vector3().fromArray(info.caja[1])):null;
    if(caja)caja.expandByScalar(caja.getSize(new T.Vector3()).length()*.06);
    listo(model,caja);
  }catch(e){console.error(e);fallo('No se pudo armar el modelo. Recargá la página para intentarlo de nuevo.')}
}

function brillo(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);

function fijarNoche(V,on){

function zoomHacia(V,P,k){
  const {cam,ctl,T}=V, r=V.caja?V.caja.getSize(new T.Vector3()).length():1;
  const dc=cam.position.clone().sub(P), dt=ctl.target.clone().sub(P);
  if(k<1&&dc.length()*k<r*.015){const dir=new T.Vector3();cam.getWorldDirection(dir);dir.multiplyScalar(r*.03);cam.position.add(dir);ctl.target.add(dir);return}
  cam.position.copy(P).add(dc.multiplyScalar(k));ctl.target.copy(P).add(dt.multiplyScalar(k));
}
function encuadrar(V,caja,animar,dirActual){
  const {T,cam,ctl}=V;const c=caja.getCenter(new T.Vector3()),s=caja.getBoundingSphere(new T.Sphere()).radius||1;
  const d=s/Math.sin(cam.fov*Math.PI/360)*1.08;
  const dir=dirActual?cam.position.clone().sub(ctl.target).normalize():new T.Vector3(1,.75,1.25).normalize();
  const p=c.clone().add(dir.multiplyScalar(d));
  cam.near=Math.max(s/2000,.001);cam.far=s*60;cam.updateProjectionMatrix();
  if(animar)irA(V,p,c);else{cam.position.copy(p);ctl.target.copy(c);ctl.update()}

/* ---- Desglose del trabajo final ---- */
function prepararDesglose(V){
  const {T,model,box}=V;
  let raiz=model;while(raiz.children.filter(c=>!c.isCamera).length===1)raiz=raiz.children.find(c=>!c.isCamera);
  const partes=[];
  raiz.children.forEach(p=>{
    const bb=new T.Box3().setFromObject(p);if(bb.isEmpty())return;
    p.traverse(o=>{if(o.material)o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone()});
    partes.push({obj:p,base:p.position.clone(),centro:bb.getCenter(new T.Vector3()),cat:rolDe(bb,V.caja)});
  });
  const grupos={};partes.forEach(p=>{(grupos[p.cat.label]=grupos[p.cat.label]||{label:p.cat.label,col:p.cat.col,nivel:p.cat.nivel,partes:[]}).partes.push(p)});
  const lista=Object.values(grupos);lista.sort((a,b)=>b.nivel-a.nivel);
  const sz=V.caja.getSize(new T.Vector3()),C=V.caja.getCenter(new T.Vector3());
  const gap=Math.max(sz.y*.75,Math.max(sz.x,sz.z)*.1);
  lista.forEach(g=>g.partes.forEach(p=>{
    const w=new T.Vector3((p.centro.x-C.x)*.12,g.nivel*gap,(p.centro.z-C.z)*.12);
    const par=p.obj.parent;par.updateMatrixWorld(true);
    const o0=par.worldToLocal(new T.Vector3(0,0,0)),o1=par.worldToLocal(w.clone());p.off=o1.sub(o0);
  }));
  V.partes=partes;V.grupos=lista;V.solo=null;
  const panel=box.closest('.obra,main').querySelector('.desglose');panel.hidden=false;
  const chips=panel.querySelector('.chips');
  chips.innerHTML=`<button type="button" class="chip chip-todo" data-grupo="todo" aria-pressed="true">Modelo completo</button>`+lista.map((g,i)=>`<button type="button" class="chip" data-grupo="${i}" aria-pressed="false"><i style="background:${g.col}"></i>${g.label}<small>${g.partes.length} ${g.partes.length===1?'pieza':'piezas'}</small></button>`).join('');
  chips.addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const g=b.dataset.grupo;V.solo=(g==='todo'||V.solo===+g)?null:+g;
    chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.grupo==='todo'?V.solo===null:V.solo===+c.dataset.grupo)));aplicarSolo(V)});
  const range=panel.querySelector('input[type=range]');
  range.addEventListener('input',()=>{V.desgAnim=null;fijarDesglose(V,range.value/100)});
  V.range=range;V.btnDesg=panel.querySelector('[data-v3="desglosar"]');
}
function fijarDesglose(V,t){
  V.t=t;V.partes.forEach(p=>p.obj.position.copy(p.base).addScaledVector(p.off,t));
  if(V.range)V.range.value=Math.round(t*100);
  if(V.btnDesg){V.btnDesg.setAttribute('aria-pressed',String(t>.5));V.btnDesg.textContent=t>.5?'Volver a armar':'Desglosar'}
}
function animarDesglose(V,dest){
  const t0=V.t,ini=performance.now(),ms=RM()?0:1100;
  if(!ms){fijarDesglose(V,dest);encuadrarDesglose(V);return}
  V.desgAnim=()=>{const u=Math.min(1,(performance.now()-ini)/ms),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;fijarDesglose(V,t0+(dest-t0)*e);if(u>=1){V.desgAnim=null;encuadrarDesglose(V)}};
}
function encuadrarDesglose(V){V.model.updateMatrixWorld(true);const bb=new V.T.Box3().setFromObject(V.model);encuadrar(V,bb,true,true)}
function aplicarSolo(V){
  V.grupos.forEach((g,i)=>g.partes.forEach(p=>p.obj.traverse(o=>{if(!o.material)return;(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
    if(m.userData.op0===undefined){m.userData.op0=m.opacity;m.userData.tr0=m.transparent}
    const atenuar=V.solo!==null&&V.solo!==i;
    m.transparent=atenuar?true:m.userData.tr0;m.opacity=atenuar?.08:m.userData.op0;m.depthWrite=!atenuar;m.needsUpdate=true})})));
}

function exGirar(el,dir){
  const n=el.querySelectorAll('.ex-obra img').length,a=+el.dataset.cara,b=(a+dir+n)%n;el.dataset.cara=b;
  const obra=el.querySelector('.ex-obra'),imgs=el.querySelectorAll('.ex-obra img'),disco=el.querySelector('.ex-disco');
  const poner=()=>imgs.forEach((im,i)=>im.classList.toggle('on',i===b));
  disco.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i===b));
  const sec=el.closest('.expo');sec.querySelector('.mz-cont').textContent=`${b+1} / ${n}`;
  if(RM()||!obra.animate){poner();return}
  const s=dir>0?1:-1;
  obra.animate([{transform:'perspective(900px) rotateY(0)'},{transform:`perspective(900px) rotateY(${-88*s}deg)`}],{duration:230,easing:'ease-in'}).onfinish=()=>{
    poner();obra.animate([{transform:`perspective(900px) rotateY(${88*s}deg)`},{transform:'perspective(900px) rotateY(0)'}],{duration:330,easing:'cubic-bezier(.2,1.3,.4,1)'})};
}
function iniciarExpos(){
  document.querySelectorAll('[data-giro]').forEach(el=>{if(el.dataset.ok)return;el.dataset.ok=1;
    let x0=null,acc=0;
    el.addEventListener('pointerdown',e=>{x0=e.clientX;acc=0;el.setPointerCapture(e.pointerId);el.classList.add('girando')});
    el.addEventListener('pointermove',e=>{if(x0===null)return;acc+=e.clientX-x0;x0=e.clientX;if(Math.abs(acc)>70){exGirar(el,acc<0?1:-1);acc=0}});
    const fin=()=>{x0=null;el.classList.remove('girando')};el.addEventListener('pointerup',fin);el.addEventListener('pointercancel',fin);
    el.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();exGirar(el,1)}else if(e.key==='ArrowLeft'){e.preventDefault();exGirar(el,-1)}});
  });
  document.querySelectorAll('[data-movil]').forEach(el=>{if(el.dataset.ok)return;el.dataset.ok=1;
    const capas=[...el.querySelectorAll('.capa')],N=capas.length;
    const ang=new Array(N).fill(0),vel=new Array(N).fill(0);
    const LIM=[5,15,17,18,20],K=[.010,.016,.019,.022,.026],F=[.012,.045,.055,.065,.08],FASE=[0,1.3,2.1,3.7,4.6],PER=[3100,1900,2300,1700,2600];
    let ult=null,activo=false;
    const empujar=f=>{for(let k=0;k<N;k++)vel[k]+=f*F[k]*(k%2?-1:1)*(.8+Math.random()*.4)};
    el._soplar=f=>{for(let k=0;k<N;k++)vel[k]+=f*(k?.16:.04)*(Math.random()<.5?-1:1)};
    el.addEventListener('pointermove',e=>{if(ult!==null){const dx=Math.max(-30,Math.min(30,e.clientX-ult));empujar(dx)}ult=e.clientX});
    el.addEventListener('pointerleave',()=>ult=null);
    el.addEventListener('pointerdown',()=>el._soplar(2.5));
    if(RM())return;
    new IntersectionObserver(es=>es.forEach(en=>{activo=en.isIntersecting;if(activo)paso()})).observe(el);
    function paso(){if(!activo)return;requestAnimationFrame(paso);const t=performance.now();
      for(let k=0;k<N;k++){
        const brisa=Math.sin(t/PER[k]+FASE[k])*(k?2.2:.8);
        vel[k]+=(brisa-ang[k])*K[k]*.35-ang[k]*K[k]*.4;vel[k]*=.962;ang[k]+=vel[k];
        if(Math.abs(ang[k])>LIM[k]){ang[k]=Math.sign(ang[k])*LIM[k];vel[k]*=-.3}
        capas[k].style.transform=`rotate(${ang[k].toFixed(2)}deg)`}}
  });
}

 ['O',"'Monoton',sans-serif",'var(--verde)','var(--amarillo)',-2]];

function vistaInicio(){
  const letras=LETRAS.map(([l,f,bg,fg,r])=>`<span style="font-family:${f};background:${bg};color:${fg};transform:rotate(${r}deg)${bg==='var(--crema)'?';box-shadow:inset 0 0 0 3px var(--verde)':''}">${l}</span>`).join('');
  const cards=CATS.map((c,i)=>`<a class="card" href="#${c.id}">
      <div><div class="num">${String(i+1).padStart(2,'0')} / 03</div></div>
      <div style="display:grid;gap:14px"><h3>${c.name}</h3><ul>${c.lista.map(x=>`<li>${x}.</li>`).join('')}</ul></div>
      <span class="ir">Entrar →</span></a>`).join('');
  return `<header class="hero cuadricula gutter" id="inicio">
    <div class="fila arriba">
      <div class="slot s-auri"><div class="obj">${SVG.auri()}</div></div>
      <div class="slot s-peg"><div class="obj">${SVG.pegamento()}</div></div>
      <div class="slot s-cinta"><div class="obj">${SVG.cinta()}</div></div>
    </div>
    <div class="centro">
      <h1 class="hola">¡Hola! Soy <span class="paz">Paz.</span></h1>
      <p class="collage" role="img" aria-label="PORTFOLIO"><span aria-hidden="true" style="display:contents">${letras}</span></p>
      <nav class="botones" aria-label="Accesos">
        <a class="tag" href="#sobre-mi">Sobre mí</a>
        <a class="tag verde" href="#malla">Malla curricular</a>
      </nav>
    </div>
    <div class="fila abajo">
      <div class="slot s-tabla"><div class="obj">${SVG.tabla()}</div></div>
      <div class="slot s-tijera"><div class="obj">${SVG.tijera()}</div></div>
      <div class="slot s-cutter"><div class="obj">${SVG.cutter()}</div></div>
    </div>
  </header>
  <section class="seccion cuadricula gutter" id="categorias" aria-labelledby="h-cat">
    <div class="wrap"><span class="rotulo">Trabajos por área</span>
    <h2 class="h-grande" id="h-cat">Categorías</h2>
    <div class="cards">${cards}</div></div>
  </section>
  ${seccionSobre()}
  ${zocalo()}`;
}

function zocalo(){
  const M=[['Quiero llorar','¡Me fue bien!','03:12','11:40'],['Tengo miedo','¡Amo cómo quedó!','04:47','11:41'],['Estoy cansada','¡Pero amo lo que hago!','05:30','11:41']];
  return `<footer class="zocalo gutter" aria-labelledby="h-porque"><div class="wrap">
    <div><h2 id="h-porque">¿Por qué <span>lo hago?</span></h2><p class="pista">Pasá el mouse por los mensajes</p></div>
    <div class="chat"><div class="chat-top"><i aria-hidden="true">P</i><div>Paz<small>en línea</small></div></div>
    ${M.map(([a,d,ta,td])=>`<button type="button" class="msg" aria-label="${a}. Después: ${d}"><span class="antes" aria-hidden="true">${a}</span><span class="despues" aria-hidden="true">${d}</span><time aria-hidden="true"><span class="a">${ta}</span><span class="d">${td} ✓✓</span></time></button>`).join('')}
    </div></div></footer>`;
}
function topbar(extra=''){return `<div class="topbar"><div class="izq"><a class="tag sm crema" href="#">← Inicio</a>${extra}</div></div>`}

function cuerpoMateria(c,m){
  let cuerpo='';
  const fi=FICHAS[m.id];if(fi)cuerpo+=`<section class="ficha" aria-label="Datos de la materia"><div class="ficha-anio"><span>Año</span><b>${fi[0]}</b></div>
    <div class="ficha-cuerpo"><p><span>${fi[1]}</span>${esc(fi[2])}</p><p><span>${fi[3]}</span>${esc(fi[4])}</p></div></section>`;
  if(m.muestrarios){cuerpo+=MAZOS(m.id)}
  else if(m.cuadernos){cuerpo+=CUADERNOS_HTML(m.id)}
  else if(m.planos){cuerpo+=PLANOS_HTML(m.id);if(m.expo)cuerpo+=EXPO_HTML(m.id)}
  else if(m.expo){cuerpo+=EXPO_HTML(m.id)}
  else if(m.trabajos&&m.trabajos.length&&c.enLinea){
    cuerpo+=`<div class="obras">${m.trabajos.map(t=>`<article class="obra${t.destacado?' destacada':''}" id="tr-${m.id}-${t.id}">
      <h3 class="obra-h">${t.t}${t.destacado?' <span class="sello">Trabajo final</span>':''}</h3>
      ${t.desc?`<p class="desc">${t.desc}</p>`:''}${contenidoTrabajo(t)}</article>`).join('')}</div>`;
  } else if(m.trabajos&&m.trabajos.length){
    cuerpo+=`<ul class="trabajos">${m.trabajos.map(t=>`<li><span class="t">${t.t}</span><a class="tag sm${t.destacado?' verde':''}" href="#t-${m.id}-${t.id}">Ver trabajo</a></li>`).join('')}</ul>`;
  } else cuerpo+=`<p class="vacio">Todavía no hay trabajos cargados en esta materia.</p>`;
  return cuerpo;
}
function cuantos(m){
  if(m.muestrarios)return (MUESTRARIOS[m.id]||[]).reduce((a,x)=>a+x.laminas.length,0);
  if(m.cuadernos)return (CUADERNOS[m.id]||[]).reduce((a,x)=>a+x.paginas.length,0);
  if(m.planos)return (PLANOS[m.id]||[]).length+((m.expo&&EXPOS[m.id])||[]).length;
  if(m.expo)return (EXPOS[m.id]||[]).length;
  return (m.trabajos||[]).length;
}
function vistaCategoria(c){
  const i=CATS.indexOf(c);
  const mats=c.materias.map((m,k)=>{const n=cuantos(m);
    return `<a class="mat-link${n?'':' vacia'}" href="#m-${m.id}" style="--rot:${[-1,.8,-.5,1.1][k%4]}deg">
      <span class="mat-num">${String(k+1).padStart(2,'0')}</span><span class="mat-nombre">${m.name}</span>
      ${n?'':'<small>Próximamente</small>'}<span class="mas" aria-hidden="true">→</span></a>`}).join('');
  return `<main class="pagina cuadricula gutter"><div class="wrap"><div class="topbar"><div class="izq"><a class="tag sm crema" href="#categorias">← Inicio</a></div></div>
    <div class="cabecera"><h1 class="bloque-titulo" style="background:${COLORS[i]};color:${INK[i]}">${c.name}</h1></div>
    <nav class="mat-lista" aria-label="Materias de ${c.name}">${mats}</nav></div></main>`;
}
function vistaMateria(c,m){
  const i=CATS.indexOf(c),k=c.materias.indexOf(m),sig=c.materias[k+1];
  return `<main class="pagina cuadricula gutter"><div class="wrap"><div class="topbar"><div class="izq"><a class="tag sm" href="#${c.id}">← ${c.name}</a></div></div>
    <div class="cabecera"><span class="materia-chip">${c.name}</span>
      <h1 class="bloque-titulo" style="background:${COLORS[i]};color:${INK[i]}">${m.name}</h1></div>
    <section class="materia materia-pagina" id="mat-${m.id}"><div class="mat-cuerpo" id="cu-${m.id}">${cuerpoMateria(c,m)}</div></section>
    <footer class="fin-materia">
      <p>¿Terminaste de ver ${m.name}?</p>
      <div class="fin-botones"><a class="tag verde" href="#${c.id}">← Volver a ${c.name}</a>
      ${sig?`<a class="tag" href="#m-${sig.id}">Siguiente: ${sig.name} →</a>`:''}</div>
    </footer></div></main>`;
}

function contenidoTrabajo(t){
  if(t.vista&&VISTAS[t.vista])return VISTAS[t.vista](t);
  if(t.modelo||t.paquete)return VISOR(t)+(t.renders?RENDERS(t):'');
  const files=t.files.map(f=>`<code>${esc(f)}</code>`).join(', ');
  let pend;
  if(t.dae){
    pend=`<div class="pendiente"><h3>Falta el modelo 3D</h3>
      <p>Para mostrar este trabajo en el visor interactivo necesito el archivo ${files} y, si SketchUp lo exportó con texturas, la carpeta de texturas que va al lado.</p>
      <p>Acá va a ir el modelo real, con giro arrastrando, zoom hacia el cursor, gestos táctiles y los botones “Vista inicial”, “Acercar” y “Alejar”.</p></div>`;
  } else {
    pend=`<div class="pendiente"><h3>${t.files.length>1?'Faltan los archivos':'Falta el archivo'}</h3>
      <p>Para armar este trabajo necesito ${files}.</p><p>Acá va a ir: ${t.plan}</p></div>`;
  }
  return pend;
}
function vistaTrabajo(m,c,t){
  const pend=contenidoTrabajo(t);
  return `<main class="pagina cuadricula gutter"><div class="wrap">
    ${topbar(`<a class="tag sm" href="#m-${m.id}">← ${m.name}</a>`)}
    <div style="margin-top:22px"><span class="materia-chip">${m.name}</span></div>
    <h1 class="obra-titulo">${t.t}</h1>
    ${t.desc?`<p class="desc">${t.desc}</p>`:''}
    ${pend}</div></main>`;
}

function seccionSobre(){
  const fotos=[['paz-2',695,1000,'yo','Retrato de Paz sonriendo, en blanco y negro',-4],
               ['paz-1',571,828,'dibujando','Paz dibujando planos sobre una mesa, en blanco y negro',3],
               ['paz-3',750,1000,'en la obra','Paz en obra revisando un pilar de mampostería, en blanco y negro',-2]];
  const dib=[['dibujo-casa',900,627,'Fachada de una casa con techo inclinado, en marcador',5],
             ['dibujo-arco',596,900,'Arco de piedra con columnas jónicas, en tinta',-6],
             ['dibujo-colegio',900,615,'Portada del Colegio Militar de la Nación, en lápiz',4],
             ['dibujo-infancia',900,656,'Dibujo de la infancia: una casa en corte y un árbol con escalera',-3]];

        ${dib.map(([f,w,h,a,r],i)=>`<figure class="dib dib-${i+1}" style="--r:${r}deg"><img src="sobre/${f}.jpg" width="${w}" height="${h}" alt="${a}" loading="lazy"></figure>`).join('')}
        ${fotos.map(([f,w,h,ep,a,r],i)=>`<figure class="pola pola-${i+1}" style="--r:${r}deg"><img src="sobre/${f}.jpg" width="${w}" height="${h}" alt="${a}"><figcaption>${ep}</figcaption><span class="cinta" aria-hidden="true"></span></figure>`).join('')}

      <div style="min-width:0"><h2 class="sobre-h" id="h-sobre">Sobre mí</h2>
        <p>Siempre me caractericé por ser una persona expresiva, creativa y curiosa, con interés por explorar distintas formas de comunicar ideas. Durante mi etapa escolar elegí orientarme hacia la construcción, donde obtuve el título de <span class="mmo">Maestra Mayor de Obras</span>. Esta formación fue mi primer acercamiento al mundo de la arquitectura, permitiéndome desarrollar conocimientos técnicos y comprender los procesos que intervienen en la materialización de un proyecto.</p>
        <p>A partir de esta experiencia, continué mi formación en arquitectura, encontrando en ella un espacio donde combinar mis intereses, desarrollar mi creatividad y profundizar mi mirada sobre el entorno construido. Considero cada experiencia como una oportunidad de aprendizaje y crecimiento, y entiendo mi trayectoria como un proceso continuo de búsqueda, exploración y construcción de una identidad propia.</p>
        <div class="contacto" aria-labelledby="h-contacto"><h3 id="h-contacto">Contacto</h3>
          <ul>
            <li><span>Instagram</span><a href="https://instagram.com/pazzlunaa" target="_blank" rel="noopener">@pazzlunaa ↗</a></li>
            <li><span>Mail</span><b class="sel">paezlunamariapaz@gmail.com</b><button type="button" data-copiar="paezlunamariapaz@gmail.com">Copiar</button></li>
            <li><span>Teléfono</span><b class="sel">11 3632-0863</b><button type="button" data-copiar="1136320863">Copiar</button><a href="https://wa.me/541136320863" target="_blank" rel="noopener">WhatsApp ↗</a></li>
          </ul></div>
        <a class="tag sm" href="#inicio" style="margin-top:10px">↑ Volver al inicio</a>
      </div></div></div></section>`;

function vistaMalla(){
  return `<main class="pagina cuadricula gutter"><div class="wrap">${topbar()}
    <div class="cabecera"><h1 class="bloque-titulo" style="background:var(--kiwi);color:var(--verde)">Malla curricular</h1></div>
    <figure class="malla"><img src="malla.jpg" width="2703" height="2027" alt="Malla curricular del plan de estudios 2012 de la carrera de Arquitectura de la USAL"></figure>
    <button type="button" class="tag sm" data-malla>Ver en grande ↗</button></div></main>`;

/* ======== Router ======== */
const app=document.getElementById('app');
function render(){
  const h=decodeURIComponent(location.hash.slice(1));
  const enPortada=document.getElementById('inicio');
  if(enPortada&&['','inicio','sobre-mi','categorias'].includes(h)){
    const dest=document.getElementById(h==='sobre-mi'?'sobre-mi':h==='categorias'?'categorias':'inicio');
    dest.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;
  }
  let html,scrollTo=null;
  const cat=CATS.find(c=>c.id===h);
  if(!h){html=vistaInicio()}
  else if(h==='categorias'){html=vistaInicio();scrollTo='categorias'}
  else if(h==='sobre-mi'||h==='inicio'){html=vistaInicio();scrollTo=h==='sobre-mi'?'sobre-mi':null}
  else if(h==='malla'){html=vistaMalla()}
  else if(cat){html=vistaCategoria(cat)}
  else if(h.startsWith('m-')&&findMat(h.slice(2))){const r=findMat(h.slice(2));html=vistaMateria(r.c,r.m)}
  else if(h.startsWith('t-')){
    const [,mid,tid]=h.split('-');const r=findMat(mid);const t=r&&r.m.trabajos&&r.m.trabajos.find(x=>x.id===tid);
    if(t&&r.c.enLinea){html=vistaMateria(r.c,r.m);scrollTo='tr-'+r.m.id+'-'+t.id}
    else html=t?vistaTrabajo(r.m,r.c,t):vistaInicio();
  } else html=vistaInicio();
  app.innerHTML=html;
  activarTrabajos();
  iniciarMazos();
  iniciarCuadernos();
  iniciarPlanos();
  iniciarExpos();
  mostrarFoto(fotoIdx);
  const el=scrollTo&&document.getElementById(scrollTo);
  if(el){requestAnimationFrame(()=>el.scrollIntoView({block:'start'}))} else window.scrollTo(0,0);
}
app.addEventListener('click',e=>{
  const b=e.target.closest('.mat-btn');if(!b)return;
  const open=b.getAttribute('aria-expanded')==='true';
  b.setAttribute('aria-expanded',String(!open));
  document.getElementById(b.getAttribute('aria-controls')).hidden=open;
});
let fotoIdx=0,fotoTimer=null;
function mostrarFoto(i){
  const imgs=document.querySelectorAll('.fotos img');if(!imgs.length)return;
  fotoIdx=(i+imgs.length)%imgs.length;
  imgs.forEach((im,k)=>{im.classList.toggle('on',k===fotoIdx);k===fotoIdx?im.removeAttribute('aria-hidden'):im.setAttribute('aria-hidden','true')});
  document.querySelectorAll('.puntos button').forEach((b,k)=>b.setAttribute('aria-current',String(k===fotoIdx)));
}
function arrancarFotos(){
  clearInterval(fotoTimer);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  fotoTimer=setInterval(()=>{if(document.querySelector('.fotos'))mostrarFoto(fotoIdx+1)},3200);
}
app.addEventListener('click',e=>{const m=e.target.closest('.msg');if(m){m.classList.toggle('feliz');return}const b=e.target.closest('[data-foto]');if(b){mostrarFoto(+b.dataset.foto);arrancarFotos()}});
arrancarFotos();
window.addEventListener('hashchange',render);
render();
</script>
